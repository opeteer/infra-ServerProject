events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimal buffer & timeout settings
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;

        # ======================================================================
        # 1. Central Watchtower CD Webhook Endpoint (Permanen)
        # ======================================================================
        location /v1/update {
            proxy_pass http://watchtower:8080/v1/update;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ======================================================================
        # 2. Central Provisioning Bot API (Zero-Touch Onboarding dari GitHub Actions)
        # ======================================================================
        location /api/provision {
            proxy_pass http://host.docker.internal:8090/api/provision;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 60s;
        }

        # ======================================================================
        # 2. Modular Route Plug-ins (Proyek-Proyek Terdaftar)
        # ======================================================================
        # Setiap file .conf di folder /etc/nginx/conf.d/routes/ akan otomatis di-load
        include /etc/nginx/conf.d/routes/*.conf;

        # ======================================================================
        # 3. Web Grafis Dashboard Launchpad (Halaman Utama Server)
        # ======================================================================
        location / {
            root /usr/share/nginx/html/gateway;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
