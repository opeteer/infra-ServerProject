services:
  # ============================================================================
  # 1. Core Server Infrastructure (Gateway & Central CD Engine)
  # ============================================================================
  proxy:
    image: nginx:alpine
    container_name: server-proxy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROXY_BIND_IP:-127.0.0.1}:${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./gateway-ui:/usr/share/nginx/html/gateway:ro
    networks:
      - server-net
    depends_on:
      - web
      - watchtower

  watchtower:
    image: containrrr/watchtower:latest
    container_name: server-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
    networks:
      - server-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sia-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://proxy:80
    networks:
      - server-net
    depends_on:
      - proxy

  # ============================================================================
  # 2. Registered Web Applications
  # ============================================================================
  # Proyek 1: SIA USD Web Application
  web:
    image: ghcr.io/opeteer/sia-web:latest
    container_name: sia-web
    restart: unless-stopped
    environment:
      - PORT=8020
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mydatabase}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-myuser}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-secret_postgres_password}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DOCKER_COMPOSE_ENABLED=false
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - server-net
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: 'postgres:16-alpine'
    container_name: sia-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mydatabase}
      - POSTGRES_USER=${POSTGRES_USER:-myuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret_postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - server-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydatabase}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Proyek 2: Nimbus Web Downloader (Disajikan dari GitHub Container Registry)
  nimbus:
    image: ghcr.io/opeteer/nimbus:latest
    container_name: nimbus-web
    restart: unless-stopped
    networks:
      - server-net
    environment:
      - PORT=8000
      - NIMBUS_PASSWORD=${NIMBUS_PASSWORD:-nimbus123}
    volumes:
      - nimbus_downloads:/app/downloads
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  server-net:
    name: server-net
    driver: bridge

volumes:
  postgres_data:
  nimbus_downloads:
