services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: sia-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mydatabase}
      - POSTGRES_USER=${POSTGRES_USER:-myuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret_postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydatabase}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/opeteer/sia-web:latest
    container_name: sia-web
    restart: unless-stopped
    environment:
      - PORT=8020
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mydatabase}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-myuser}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-secret_postgres_password}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DOCKER_COMPOSE_ENABLED=false
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      postgres:
        condition: service_healthy

  watchtower:
    image: containrrr/watchtower:latest
    container_name: sia-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true

  proxy:
    image: nginx:alpine
    container_name: sia-proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - watchtower

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sia-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://proxy:80
    depends_on:
      - proxy

volumes:
  postgres_data:
