# ==============================================================================
# Route Plug-in: Nimbus Web Downloader
# ==============================================================================

# Normalisasi trailing slash untuk path /nimbus
location = /nimbus {
    return 301 /nimbus/;
}

location /nimbus/ {
    # Forward traffic ke kontainer nimbus-web di server-net
    proxy_pass http://nimbus-web:8000/;
    
    # Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /nimbus;

    # Dukungan WebSocket untuk realtime progress bar & ETA download
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Optimasi Streaming Media & Unduhan File Besar (ZIP / Video)
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 500M;
}
