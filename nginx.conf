events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # ======================================================================
        # 1. Central Watchtower CD Webhook Endpoint
        # ======================================================================
        location /v1/update {
            proxy_pass http://watchtower:8080/v1/update;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ======================================================================
        # 2. Proyek Web 1: SIA USD Web Portal
        # ======================================================================
        location /sia/ {
            proxy_pass http://web:8020/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /sia;
        }

        # Routing Aset Statis & Backend API untuk SIA USD
        location /api/ {
            proxy_pass http://web:8020/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /assets/ {
            proxy_pass http://web:8020/assets/;
            proxy_set_header Host $host;
        }

        location = /logo_usd.png {
            proxy_pass http://web:8020/logo_usd.png;
        }

        # ======================================================================
        # 3. Web Grafis Dashboard Launchpad (Halaman Utama Server)
        # ======================================================================
        location / {
            root /usr/share/nginx/html/gateway;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
