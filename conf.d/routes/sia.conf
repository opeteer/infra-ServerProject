# ==============================================================================
# Route Plug-in: SIA USD Web Portal
# ==============================================================================

location /sia/ {
    proxy_pass http://web:8020/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /sia;
}

# Routing Aset Statis & Backend API untuk SIA USD
location /api/ {
    proxy_pass http://web:8020/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /assets/ {
    proxy_pass http://web:8020/assets/;
    proxy_set_header Host $host;
}

location = /logo_usd.png {
    proxy_pass http://web:8020/logo_usd.png;
}
